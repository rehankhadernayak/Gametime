<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <rect width="400" height="250" rx="14" fill="#F8F9FA"/>
  <rect width="400" height="250" rx="14" fill="none" stroke="#E0E0E0" stroke-width="2"/>
  <!-- Google Play triangle logo (4 colored triangles) -->
  <g transform="translate(35,75)">
    <polygon points="0,0 0,100 50,50" fill="#4CAF50"/>
    <polygon points="0,0 50,50 70,30 25,5" fill="#2196F3"/>
    <polygon points="50,50 70,30 70,70" fill="#F44336"/>
    <polygon points="0,100 25,95 70,70 50,50" fill="#FFEB3B"/>
  </g>
  <text x="245" y="100" font-family="'Product Sans',Arial,sans-serif" font-size="26" font-weight="700" fill="#1A1A1A" text-anchor="middle">Google Play</text>
  <text x="245" y="132" font-family="Arial,sans-serif" font-size="14" fill="#666666" text-anchor="middle" letter-spacing="3">GIFT CARD</text>
  <line x1="145" y1="155" x2="345" y2="155" stroke="#E0E0E0" stroke-width="1"/>
  <text x="245" y="200" font-family="Arial,sans-serif" font-size="12" fill="#999999" text-anchor="middle">play.google.com/redeem</text>
</svg>
