<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="mc-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3D8B37"/><stop offset="100%" stop-color="#2A5E25"/></linearGradient>
  </defs>
  <rect width="400" height="250" rx="14" fill="url(#mc-bg)"/>
  <!-- Pixel/block pattern -->
  <rect x="20" y="20" width="20" height="20" fill="rgba(255,255,255,0.06)"/>
  <rect x="60" y="20" width="20" height="20" fill="rgba(255,255,255,0.04)"/>
  <rect x="40" y="40" width="20" height="20" fill="rgba(255,255,255,0.06)"/>
  <!-- Creeper face (simplified pixel art) -->
  <g transform="translate(28,50)">
    <!-- Head -->
    <rect x="0" y="0" width="80" height="80" fill="#5D9E4E"/>
    <rect x="0" y="0" width="80" height="80" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="2"/>
    <!-- Eyes -->
    <rect x="12" y="20" width="20" height="20" fill="#1A1A1A"/>
    <rect x="48" y="20" width="20" height="20" fill="#1A1A1A"/>
    <!-- Mouth (creeper style) -->
    <rect x="20" y="48" width="12" height="16" fill="#1A1A1A"/>
    <rect x="48" y="48" width="12" height="16" fill="#1A1A1A"/>
    <rect x="20" y="64" width="40" height="8" fill="#1A1A1A"/>
    <rect x="32" y="48" width="16" height="8" fill="#1A1A1A"/>
  </g>
  <text x="250" y="100" font-family="Arial Black,Arial,sans-serif" font-size="32" font-weight="900" fill="white" text-anchor="middle" letter-spacing="1">Minecraft</text>
  <text x="250" y="130" font-family="Arial,sans-serif" font-size="14" fill="rgba(255,255,255,0.8)" text-anchor="middle" letter-spacing="4">GIFT CARD</text>
  <line x1="150" y1="152" x2="350" y2="152" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="250" y="200" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">minecraft.net/redeem</text>
</svg>
