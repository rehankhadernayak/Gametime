<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="xb-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#107C10"/><stop offset="100%" stop-color="#0A5A0A"/></linearGradient>
    <radialGradient id="xb-glow" cx="50%" cy="40%"><stop offset="0%" stop-color="#52C152"/><stop offset="100%" stop-color="transparent"/></radialGradient>
  </defs>
  <rect width="400" height="250" rx="14" fill="url(#xb-bg)"/>
  <ellipse cx="200" cy="80" rx="180" ry="90" fill="url(#xb-glow)" opacity="0.18"/>
  <!-- Xbox circle logo -->
  <circle cx="68" cy="110" r="52" fill="none" stroke="white" stroke-width="5" opacity="0.9"/>
  <circle cx="68" cy="110" r="38" fill="none" stroke="white" stroke-width="3" opacity="0.5"/>
  <!-- X mark -->
  <line x1="48" y1="90" x2="88" y2="130" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <line x1="88" y1="90" x2="48" y2="130" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <text x="225" y="100" font-family="Arial Black,Arial,sans-serif" font-size="42" font-weight="900" fill="white" text-anchor="middle" letter-spacing="1">XBOX</text>
  <text x="225" y="135" font-family="Arial,sans-serif" font-size="14" fill="rgba(255,255,255,0.8)" text-anchor="middle" letter-spacing="4">GIFT CARD</text>
  <line x1="130" y1="155" x2="320" y2="155" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="225" y="200" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle">microsoft.com/xboxgiftcard</text>
</svg>
