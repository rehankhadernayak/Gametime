<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="fn-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1B1464"/><stop offset="100%" stop-color="#0A0A2E"/></linearGradient>
    <linearGradient id="fn-accent" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00D4FF"/><stop offset="100%" stop-color="#8B00FF"/></linearGradient>
  </defs>
  <rect width="400" height="250" rx="14" fill="url(#fn-bg)"/>
  <!-- Lightning bolt shape (V-Bucks style) -->
  <polygon points="90,50 60,130 85,130 65,200 130,105 100,105 125,50" fill="url(#fn-accent)" opacity="0.9"/>
  <!-- Glow effect -->
  <polygon points="90,50 60,130 85,130 65,200 130,105 100,105 125,50" fill="none" stroke="#00D4FF" stroke-width="2" opacity="0.4"/>
  <text x="255" y="108" font-family="Arial Black,Arial,sans-serif" font-size="34" font-weight="900" fill="white" text-anchor="middle" letter-spacing="1">FORTNITE</text>
  <text x="255" y="136" font-family="Arial,sans-serif" font-size="13" fill="rgba(0,212,255,0.9)" text-anchor="middle" letter-spacing="5">V-BUCKS CARD</text>
  <line x1="150" y1="158" x2="360" y2="158" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <text x="255" y="200" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle">epicgames.com/fortnite</text>
</svg>
