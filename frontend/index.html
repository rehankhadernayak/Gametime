<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gametime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Typography: Geist is the agreed global font; we self-host it later.
      Inter Tight is the Google-Fonts-served fallback that ships with the same
      tightened metrics until Geist is dropped into /public/fonts.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Apply saved theme before React renders to prevent dark-flash on light mode -->
    <script>
      (function () {
        var t = localStorage.getItem('gametime_theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
