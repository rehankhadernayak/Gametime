version: '3.9'
services:
  backend:
    build: ./backend
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      JWT_SECRET: docker-secret
      JWT_EXPIRES_IN: 2h
      DATABASE_PATH: ./data/gametime.db
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - ./backend/data:/app/data
  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    depends_on:
      - backend
